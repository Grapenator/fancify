<!DOCTYPE html>
<html>
  <head>
    <title>Fancify Shamcify</title>
    <script src="fancifymytext.js"></script>
  </head>

  <body>
    <h1>Fancify my Text</h1>

    <!-- Text Input Field -->
    <fieldset>
      <legend>Text</legend>
      <textarea id="text-area" rows="4" cols="30"></textarea>
    </fieldset>

    <!-- Fancify Controls -->
    <fieldset>
      <legend>Fancify</legend>
      <button onclick="makeTextBigger()">Bigger!</button>
      <br><br>
      <input type="radio" id="fancy" name="style" onchange="fancifyText()" />
      <label for="fancy">FancyShmancy</label><br>

      <input type="radio" id="boring" name="style" onchange="fancifyText()" />
      <label for="boring">BoringBetty</label><br><br>

      <button onclick="mooifyText()">Moo</button>
    </fieldset>
  </body>
</html>
